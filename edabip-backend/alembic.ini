# Alembic Config — Auth Service
# Run migrations: alembic -c backend/alembic.ini upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Left blank on purpose: alembic/env.py sets it at runtime from
# settings.DATABASE_URL (app/core/config.py), which is built from DB_NAME and
# the other DB_* settings. A URL here would be ignored, and a stale one
# (it used to point at auth_service) only misleads.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
